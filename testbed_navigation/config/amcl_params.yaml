amcl:
  ros__parameters:
    use_sim_time: true
    min_particles: 500          
    max_particles: 2000         
    alpha1: 0.2
    alpha2: 0.2                 # Expected process noise in odometry's rotation from translation
    alpha3: 0.2                 # Expected process noise in odometry's translation from translation
    alpha4: 0.2                 # Expected process noise in odometry's translation from rotation
    alpha5: 0.2                 # For omni models: translation noise from strafe
    base_frame_id: "base_footprint"   
    odom_frame_id: "odom"             
    global_frame_id: "map"            
    scan_topic: "scan"               
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"   
    laser_max_range: 100.0
    laser_min_range: -1.0              
    max_beams: 60
    sigma_hit: 0.2                     
    z_hit: 0.5                         
    z_max: 0.05                        
    z_rand: 0.5                        
    z_short: 0.05                      
    lambda_short: 0.1                  
    likelihood_field_dsmax: 2.0        
    resample_interval: 1               # Resample every N filter updates
    update_min_a: 0.2                  # Minimum angular movement before filter update (rad)
    update_min_d: 0.25                 # Minimum linear movement before filter update (m)
    recovery_alpha_fast: 0.0           # Fast exponential decay for recovery (0 = disabled)
    recovery_alpha_slow: 0.0           # Slow exponential decay for recovery (0 = disabled)
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0
      
    transform_tolerance: 1.0        
    tf_broadcast: true               
    save_pose_rate: 0.5            
    kld_err: 0.05                  
    kld_z: 0.99               
    do_beamskip: false                
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3